<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="940" viewBox="0 0 1065 940" role="img" aria-labelledby="title desc">
<title id="title">Delta Automation JSON rule engine</title><desc id="desc">A selected JSON file passes validation, mapped discovery and generic rule planning. Reviewed normal plans go to pending changelist execution. Inspection previews feed read-only changelist comparison. Perforce reads are separate from approved writes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#506580"/></marker></defs>
<rect width="1065" height="940" fill="#f6f8fb"/>
<text x="40" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#162b46">Delta Automation · JSON rules, shared execution engine</text>
<text x="40" y="68" font-family="sans-serif" font-size="15" fill="#506580">Domain decisions live in the selected JSON. Python supplies reusable operations.</text>
<path d="M270,200 V230" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270,335 V365" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270,470 V500" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270,615 V650" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M270,755 V790" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M795,615 V650" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M795,755 V790" stroke="#506580" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M500,560 H560" stroke="#506580" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500,420 H560" stroke="#506580" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="513" y="406" font-family="sans-serif" font-size="12" fill="#506580">reads</text>
<rect x="40" y="90" width="460" height="110" rx="10" fill="white" stroke="#b7c7da"/>
<text x="58" y="119" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Selected JSON rule file</text>
<text x="58" y="144" font-family="sans-serif" font-size="14" fill="#354d69">Inputs, sources, routes and inference</text>
<text x="58" y="166" font-family="sans-serif" font-size="14" fill="#354d69">Selectors, operations and comparison policy</text>
<rect x="40" y="235" width="460" height="100" rx="10" fill="white" stroke="#b7c7da"/>
<text x="58" y="264" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Validate + resolve inputs</text>
<text x="58" y="289" font-family="sans-serif" font-size="14" fill="#354d69">spec.py / schema.py / config.py / expressions.py</text>
<text x="58" y="311" font-family="sans-serif" font-size="14" fill="#354d69">Dynamic GUI fields; no domain rule dispatch</text>
<rect x="40" y="370" width="460" height="100" rx="10" fill="white" stroke="#b7c7da"/>
<text x="58" y="399" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Mapped discovery</text>
<text x="58" y="424" font-family="sans-serif" font-size="14" fill="#354d69">resolver.py</text>
<text x="58" y="446" font-family="sans-serif" font-size="14" fill="#354d69">Exact file or bounded tree; View exclusions honored</text>
<rect x="40" y="505" width="460" height="110" rx="10" fill="white" stroke="#b7c7da"/>
<text x="58" y="534" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Rule interpreter</text>
<text x="58" y="559" font-family="sans-serif" font-size="14" fill="#354d69">planner.py + generic content utilities</text>
<text x="58" y="581" font-family="sans-serif" font-size="14" fill="#354d69">Pinned source revisions; accumulated target edits</text>
<text x="58" y="603" font-family="sans-serif" font-size="14" fill="#354d69">Failed rule rolls back its own edits</text>
<rect x="40" y="655" width="460" height="100" rx="10" fill="white" stroke="#b7c7da"/>
<text x="58" y="684" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Sealed normal plan</text>
<text x="58" y="709" font-family="sans-serif" font-size="14" fill="#354d69">Review tab; detailed reasons saved to disk</text>
<text x="58" y="731" font-family="sans-serif" font-size="14" fill="#354d69">plan.json / plan.txt / exact proposed diffs</text>
<rect x="40" y="795" width="460" height="100" rx="10" fill="white" stroke="#b7c7da"/>
<text x="58" y="824" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Review to approved execution</text>
<text x="58" y="849" font-family="sans-serif" font-size="14" fill="#354d69">executor.py: recheck snapshots and local state</text>
<text x="58" y="871" font-family="sans-serif" font-size="14" fill="#354d69">Pending CL + verified writes + execution journal</text>
<rect x="565" y="505" width="460" height="110" rx="10" fill="white" stroke="#b7c7da"/>
<text x="583" y="534" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Inspection previews + requirements</text>
<text x="583" y="559" font-family="sans-serif" font-size="14" fill="#354d69">Same interpreter; blank.py mode</text>
<text x="583" y="581" font-family="sans-serif" font-size="14" fill="#354d69">Blank mode does not read target content</text>
<text x="583" y="603" font-family="sans-serif" font-size="14" fill="#354d69">Saved previews; cannot be applied</text>
<rect x="565" y="655" width="460" height="100" rx="10" fill="white" stroke="#b7c7da"/>
<text x="583" y="684" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Read-only changelist comparison</text>
<text x="583" y="709" font-family="sans-serif" font-size="14" fill="#354d69">Selected edits + latest exact depot revisions</text>
<text x="583" y="731" font-family="sans-serif" font-size="14" fill="#354d69">Additions, removals, extra changes and errors</text>
<rect x="565" y="795" width="460" height="100" rx="10" fill="white" stroke="#b7c7da"/>
<text x="583" y="824" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Comparison reports</text>
<text x="583" y="849" font-family="sans-serif" font-size="14" fill="#354d69">Optional comparisons; reports saved to disk</text>
<text x="583" y="871" font-family="sans-serif" font-size="14" fill="#354d69">comparison.json / comparison.txt</text>
<rect x="565" y="235" width="460" height="235" rx="10" fill="white" stroke="#b7c7da"/>
<text x="583" y="264" font-family="sans-serif" font-size="18" font-weight="bold" fill="#162b46">Perforce adapter</text>
<text x="583" y="289" font-family="sans-serif" font-size="14" fill="#354d69">perforce.py to p4 CLI</text>
<text x="583" y="311" font-family="sans-serif" font-size="14" fill="#354d69">Uses the existing login ticket</text>
<text x="583" y="333" font-family="sans-serif" font-size="14" fill="#354d69">Planning and comparison: read operations</text>
<text x="583" y="355" font-family="sans-serif" font-size="14" fill="#354d69">Apply: approved pending-changelist writes</text>
<text x="583" y="377" font-family="sans-serif" font-size="14" fill="#354d69">No automatic shelving or submission</text>
<text x="40" y="925" font-family="sans-serif" font-size="13" fill="#506580">Firmware checks verify mapped presence only. Hardware and unspecified build checks remain explicit manual rules.</text></svg>
